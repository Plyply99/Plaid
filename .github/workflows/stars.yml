name: Stars chart

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * *'

permissions:
  contents: write

concurrency:
  group: stars-chart
  cancel-in-progress: true

jobs:
  chart:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate chart
        run: python3 .github/scripts/stars.py
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Commit chart
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/stars.svg
          git diff --cached --quiet || git commit -m "chore: refresh stars chart"
          git pull --rebase --autostash
          git push

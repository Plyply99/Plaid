name: Stars chart
on:
  schedule:
    - cron: '0 0 * * *'
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  chart:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate chart
        run: python3 .github/scripts/stars.py
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Commit chart
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/stars.svg
          git diff --cached --quiet || git commit -m "chore: refresh stars chart"
          git push

name: Stars chart

on:
  workflow_dispatch:

jobs:
  chart:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate chart
        run: python3 .github/scripts/stars.py
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Upload chart
        uses: actions/upload-artifact@v4
        with:
          name: stars-svg
          path: .github/stars.svg
